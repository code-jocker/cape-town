<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/shared/browser-check.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="api-base" content="https://cape-town-backend.onrender.com" />
    <meta name="theme-color" content="#9A5322" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Waiter" />
    <meta name="description" content="Cape Town K Hotel — waiter dashboard" />
    <title>Waiter · Cape Town K Hotel</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/waiter/waiter.css" />
  </head>
  <body class="waiter-body">
    <header class="w-head">
      <div class="w-head-left">
        <img src="/icons/logo.svg" alt="" width="28" height="28" />
        <h1>Waiter</h1>
      </div>
      <div class="w-head-right">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <span class="muted" id="whoami"></span>
        <button class="btn btn-ghost btn-sm" id="logout">Logout</button>
      </div>
    </header>

    <nav class="w-tabs" id="w-tabs">
      <button class="tab active" data-tab="ready">Ready <span class="pill" data-badge="ready">0</span></button>
      <button class="tab" data-tab="requests">Requests <span class="pill" data-badge="requests">0</span></button>
      <button class="tab" data-tab="sessions">Tables <span class="pill" data-badge="sessions">0</span></button>
    </nav>
    <nav class="tab-bar hidden" id="w-tab-bar">
      <button class="tab active" data-tab="ready"><span class="ico">📋</span><span>Ready</span></button>
      <button class="tab" data-tab="requests"><span class="ico">🔔</span><span>Requests</span></button>
      <button class="tab" data-tab="sessions"><span class="ico">🍽️</span><span>Tables</span></button>
    </nav>

    <main class="w-main">
      <section class="view active" data-view="ready" id="view-ready"></section>
      <section class="view" data-view="requests" id="view-requests"></section>
      <section class="view" data-view="sessions" id="view-sessions"></section>
    </main>

    <!-- Bill sheet -->
    <div class="sheet-backdrop" id="bill-backdrop" hidden></div>
    <div class="sheet" id="bill-sheet" hidden>
      <div class="sheet-head">
        <h2 id="bill-title">Bill</h2>
        <button class="btn btn-ghost btn-sm" id="bill-close">Close</button>
      </div>
      <div class="sheet-body" id="bill-body"></div>
      <div class="sheet-foot" id="bill-foot"></div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <div id="print-area" aria-hidden="true"></div>

    <script type="module" src="/shared/theme.js"></script>
    <script type="module" src="/waiter/waiter.js"></script>
  </body>
</html>
