# nginx reverse proxy for Elite Paradize.
# Terminates TLS and forwards HTTP + Socket.IO (WebSocket) to the Node app.
#
# Socket.IO first polls over HTTP then upgrades to WebSocket, so the same
# upstream handles both — the Upgrade/Connection headers below enable the hop.

upstream paradize_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# WebSocket upgrade map: pass "upgrade" when the client requests it, else close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Uploads (menu images) can be a few MB; keep body limit modest.
    client_max_body_size 8m;

    # gzip text assets (images are already compressed WebP)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://paradize_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Socket.IO upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived sockets: don't cut them off at the default 60s.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
