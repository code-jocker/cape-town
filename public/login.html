<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/shared/browser-check.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="api-base" content="" />
    <script>window.__API_BASE_URL__ = window.__API_BASE_URL__ || 'https://cape-town-backend.onrender.com';</script>
    <meta name="theme-color" content="#9A5322" />
    <meta name="color-scheme" content="light" />
    <title>Staff login · Cape Town K Hotel</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/login.css" />
    <script src="/config.js"></script>
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
  </head>
  <body class="login-body">
    <main class="login-card card">
      <div class="login-brand">
        <img src="/icons/logo.svg" alt="" width="56" height="56" />
        <div>
          <h1>Cape Town K Hotel</h1>
          <p class="muted">Staff sign in</p>
        </div>
      </div>

      <form id="login-form" novalidate>
        <label class="field">
          <span>Username</span>
          <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="text-danger login-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block btn-lg" id="login-btn" type="submit">Sign in</button>
      </form>

      <p class="muted login-hint">Cape Town · K Hotel</p>
    </main>
    <script type="module" src="/shared/theme.js"></script>
    <script type="module" src="/login.js"></script>
  </body>
</html>
