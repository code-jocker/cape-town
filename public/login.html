<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/shared/browser-check.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="api-base" content="" />
    <script>window.__API_BASE_URL__ = window.__API_BASE_URL__ || 'https://cape-town-backend.onrender.com';</script>
    <meta name="theme-color" content="#9A5322" />
    <meta name="color-scheme" content="light" />
    <title>Staff login · Cape Town K Hotel</title>
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/login.css" />
    <script src="/config.js"></script>
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
  </head>
  <body class="login-body">
     <main class="login-card card" style="position: relative;">
      <div class="login-brand">
        <img src="/icons/logo.svg" alt="" width="56" height="56" />
        <div>
          <h1>Cape Town K Hotel</h1>
          <p class="muted">Staff sign in</p>
        </div>
      </div>

      <form id="login-form" novalidate>
        <label class="field">
          <span>Username</span>
          <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="text-danger login-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block btn-lg" id="login-btn" type="submit">Sign in</button>
      </form>

       <p class="muted login-hint">Cape Town · K Hotel</p>
       <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
         <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
         <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
       </button>
    </main>
    <script type="module" src="/shared/theme.js"></script>
    <script type="module" src="/login.js"></script>
  </body>
</html>
