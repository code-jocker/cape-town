<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/shared/browser-check.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="api-base" content="" />
    <script>window.__API_BASE_URL__ = window.__API_BASE_URL__ || 'https://cape-town-backend.onrender.com';</script>
    <meta name="theme-color" content="#9A5322" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Manager" />
    <meta name="description" content="Cape Town K Hotel — manager dashboard" />
    <title>Manager · Cape Town K Hotel</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/shared/base.css" />
    <link rel="stylesheet" href="/manager/manager.css" />
    <script src="/config.js"></script>
  </head>
  <body class="mgr-body">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <img src="/icons/logo.svg" alt="" width="34" height="34" />
        <div>
          <strong>Cape Town K Hotel</strong>
          <span class="muted">Manager</span>
        </div>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot">
        <span id="whoami" class="muted"></span>
        <button class="btn btn-ghost btn-sm" id="logout">Logout</button>
      </div>
      <button class="collapse-toggle" id="collapse-toggle" aria-label="Toggle sidebar" title="Toggle sidebar"> « </button>
    </aside>

    <div class="side-backdrop" id="side-backdrop" aria-hidden="true"></div>

    <div class="mgr-main">
      <header class="topbar">
        <button class="btn btn-ghost btn-sm" id="menu-toggle" aria-label="Menu">☰</button>
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-right">
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <span class="live-dot" id="live-dot" title="Live"></span>
          <span class="muted" id="clock"></span>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>

    <div class="toast" id="toast" hidden></div>
    <div class="install-banner" id="install-banner" hidden role="status" aria-live="polite">
      <span class="install-text">📱 Add to Home Screen for quick access</span>
      <button class="btn btn-ghost btn-sm" id="install-btn">Install</button>
      <button class="btn btn-ghost btn-sm" id="install-dismiss">×</button>
    </div>
    <div class="modal-backdrop" id="modal-backdrop" hidden></div>
    <div class="modal" id="modal" hidden>
      <div class="modal-head">
        <h2 id="modal-title">Edit</h2>
        <button class="btn btn-ghost btn-sm" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>

    <script type="module" src="/shared/theme.js"></script>
    <script type="module" src="/manager/manager.js"></script>
  </body>
</html>
